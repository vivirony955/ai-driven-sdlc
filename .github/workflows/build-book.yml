# Build book (PDF / EPUB / HTML)
# ------------------------------
# Renders the distributable formats from the canonical .docx so we always know the
# book still builds and reviewers can download a preview from the run's artifacts.
#
#   PDF  <- LibreOffice headless (faithful to the typeset Word document)
#   EPUB <- pandoc (reflowable, semantic)
#   HTML <- pandoc (single self-contained file)
#
# This is the same logic as scripts/build-artifacts.sh, run in the cloud so no one
# needs pandoc/LibreOffice locally. The release workflow reuses these outputs.
name: Build book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "scripts/build-artifacts.sh"
      - ".github/workflows/build-book.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/build-book.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice

      - name: Build PDF + EPUB + HTML
        run: bash scripts/build-artifacts.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-formats
          path: dist/
          if-no-files-found: error
          retention-days: 30
