# Link check
# ----------
# Finds broken links in Markdown using lychee (fast, handles relative + external
# links, caches results). Patterns to ignore live in ../../.lycheeignore — note
# the vivirony955/* placeholder URLs are ignored until you run set-repo-identity.
#
# Runs on PRs/pushes touching Markdown, and on a weekly schedule to catch link rot
# in external sites. The scheduled run won't fail the build (issue-only), so a
# third-party site going down doesn't block contributors.
name: Link check

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml"]
  pull_request:
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # so the scheduled run can open/update an issue on failure

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            "**/*.md"
          # On PR/push: fail if links are broken. On schedule: don't fail (we open
          # an issue instead, below).
          fail: ${{ github.event_name != 'schedule' }}

      - name: Open/refresh an issue on scheduled failure
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (weekly link check)"
          content-filepath: ./lychee/out.md
          labels: "bug, tooling, link-rot"
