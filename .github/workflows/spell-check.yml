# Spell check
# -----------
# Catches typos in Markdown using cSpell. Project terms live in
# ../../.cspell.json and ../../.cspell-project-words.txt — add real words there
# rather than disabling the check. Runs on PRs and pushes touching Markdown.
name: Spell check

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".cspell.json"
      - ".cspell-project-words.txt"
      - ".github/workflows/spell-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".cspell.json"
      - ".cspell-project-words.txt"
      - ".github/workflows/spell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run cSpell
        run: npx --yes cspell --no-progress --show-suggestions "**/*.md"
