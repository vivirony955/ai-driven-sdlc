# Markdown lint
# -------------
# Keeps the repository's Markdown consistent and well-formed. Runs on every PR
# and push that touches Markdown. Rules live in ../../.markdownlint.jsonc.
# Uses only official actions + `npx` so there is little third-party surface to
# maintain (Dependabot keeps the actions current).
name: Markdown lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint.jsonc", ".github/workflows/markdown-lint.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint.jsonc", ".github/workflows/markdown-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#dist" "#site" "#website/site"
